name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent review
    # 只在同仓库分支上跑:fork 来的 PR 拿不到 secret,也没必要在这里评。
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 评审脚本必须用「base 分支的版本」执行。
      # checkout 取的是 PR 的 ref,直接跑 PR 里的脚本等于让 PR 作者执行任意代码,
      # 而这一步持有 DEEPSEEK_API_KEY 和 pull-requests: write 的 token。
      #
      # 取的是 base 分支的**当前 head**,不是 pull_request.base.sha:后者在 PR 存续期间
      # 停在 PR 创建时的那个 commit,main 合了脚本修复它也不会动。实测 PR #6 已把解析
      # 修复合进 main,旧 PR 的下一轮仍然从旧 commit 取到没有修复的脚本。
      # 只取脚本,不动 diff 基准 —— 旧 PR 不需要为了这个去同步 main。
      # 残余风险:workflow 文件本身仍来自 PR 的 ref,同仓库分支理论上也能改它;
      # 这个岗位没有提交权限,只用于读 diff 和发评论。
      - name: Use the trusted reviewer script
        # 分支名从 env 进 shell,不直接拼进脚本正文:ref 名允许出现 $(、反引号、;,
        # 直接内插等于把分支名当代码执行。变量展开不会再求值命令替换。
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE="refs/remotes/origin/$BASE_REF"
          if git cat-file -e "$BASE:.github/scripts/review.mjs" 2>/dev/null; then
            git show "$BASE:.github/scripts/review.mjs" > .github/scripts/review.mjs
            echo "reviewer script restored from $BASE ($(git rev-parse --short "$BASE"))"
          else
            echo "::warning file=.github/scripts/review.mjs::the script does not exist on the base branch yet - this PR introduces it, so the PR copy runs this once"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 评审是建议性的:基础设施失败不应当把 PR 卡成红。
      # 失败原因写进 step summary,不发 PR 评论,避免用噪音冒充发现。
      - name: Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # diff 基准仍是 PR 自己的 base,不跟着 main 走:旧 PR 不需要同步 main。
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          REVIEW_MODEL: deepseek-flash
          REVIEW_MAX_TOKENS: 32000
        run: node .github/scripts/review.mjs
