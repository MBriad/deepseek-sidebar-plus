name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent review
    # 只在同仓库分支上跑:fork 来的 PR 拿不到 secret,也没必要在这里评。
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 评审脚本必须用「base 分支的版本」执行。
      # checkout 取的是 PR 的 ref,直接跑 PR 里的脚本等于让 PR 作者执行任意代码,
      # 而这一步持有 DEEPSEEK_API_KEY 和 pull-requests: write 的 token。
      # 残余风险:workflow 文件本身仍来自 PR 的 ref,同仓库分支理论上也能改它;
      # 这个岗位没有提交权限,只用于读 diff 和发评论。
      - name: Use the trusted reviewer script
        run: git checkout "${{ github.event.pull_request.base.sha }}" -- .github/scripts/review.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 评审是建议性的:基础设施失败不应当把 PR 卡成红。
      # 失败原因写进 step summary,不发 PR 评论,避免用噪音冒充发现。
      - name: Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          REVIEW_MODEL: deepseek-flash
          REVIEW_MAX_TOKENS: 32000
        run: node .github/scripts/review.mjs
