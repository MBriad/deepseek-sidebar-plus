name: Agent review

# 用 pull_request_target:workflow 定义来自 base 分支,PR 改不动它。
# 代价是它跑在 base 上下文,拿得到写权限和 secrets —— 所以整份文件围绕一件事:
# **不可信的东西不许和密钥出现在同一个 job 里。**
#   Job prepare:读 PR(只用 git,不执行 PR 的代码),产出 artifact,无 secrets
#   Job review :只跑 base 的代码,读 artifact(纯数据),持有 API key
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare input (no secrets)
    # 同仓库分支才评:fork 走 target 会拿到 secrets,但眼下先不把这条路打开。
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 这里是唯一碰 PR 内容的地方。只读文件,不执行 PR 的代码。
      - name: Checkout the PR (untrusted content)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr

      - name: Checkout the base branch (trusted tools)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          path: trusted

      - name: Collect diff and file contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: node trusted/.github/scripts/collect-diff.mjs --pr pr --out "$RUNNER_TEMP/review"

      - name: Upload the review input
        uses: actions/upload-artifact@v4
        with:
          name: review-input
          path: ${{ runner.temp }}/review
          retention-days: 1
          if-no-files-found: error

  review:
    name: Agent review
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 只 checkout base。**绝不**在这里 checkout PR 的代码。
      - name: Checkout the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Download the review input
        uses: actions/download-artifact@v4
        with:
          name: review-input
          path: ${{ runner.temp }}/review

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          # 输入来自 artifact;review.mjs 看到它就完全不读工作区。
          REVIEW_ARTIFACT: ${{ runner.temp }}/review
          REVIEW_MODEL: deepseek-flash
          REVIEW_MAX_TOKENS: 32000
        run: node .github/scripts/review.mjs
