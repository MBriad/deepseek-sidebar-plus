name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extension tests
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1280x1024x24" npm test

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build portable extension
        run: |
          rm -rf dist
          mkdir -p dist/portable
          cp -R manifest.json background.js rules.json INSTALL.md PRIVACY.md LICENSE NOTICE icons src _locales dist/portable/
          (cd dist/portable && zip -qr ../deepseek-sidebar-plus-portable.zip .)

      - name: Upload portable extension
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-sidebar-plus-portable
          path: dist/deepseek-sidebar-plus-portable.zip
          retention-days: 14
