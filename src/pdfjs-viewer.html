<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF.js Viewer</title>
  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <style>
    html, body { height: 100%; margin: 0; background: #525659; }
    body { display: flex; }

    /* 选区颜色对齐 Edge 原生 PDF 阅读器。pdf.js 默认是 25% 的纯蓝、还叠了
       color-mix(AccentColor)，在深色页面上偏淡；这里统一成一个实心蓝。 */
    .textLayer ::selection {
      background: rgba(0, 120, 212, .35);
      color: transparent;
    }

    .textLayer ::-moz-selection {
      background: rgba(0, 120, 212, .35);
      color: transparent;
    }

    /* 目录是占位栏，不是浮层：打开时把正文挤窄，不再盖住页面。 */
    #pdfjs-container { position: relative; flex: 1; min-width: 0; overflow: auto; }
    #pdfjs-viewer { position: relative; margin: 0 auto; padding: 24px 0; }
    .pdfjs-page {
      position: relative;
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
      overflow: hidden;
    }
    .pdfjs-page canvas { display: block; }
    #pdfjs-outline-toggle {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 18;
      padding: 7px 12px;
      border: 1px solid #4d6bfe;
      border-radius: 8px;
      background: #fff;
      color: #1b1f2a;
      font: 12px/1.4 "Microsoft YaHei", "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
    }
    #pdfjs-outline {
      position: relative;
      order: -1;
      flex: 0 0 min(300px, 45vw);
      width: min(300px, 45vw);
      z-index: 19;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 0;
      border-right: 1px solid #d8deea;
      background: #fff;
    }
    #pdfjs-outline.open { display: flex; }

    .outline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 8px 14px;
      border-bottom: 1px solid #e6eaf2;
    }
    .outline-heading {
      color: #1b1f2a;
      font: 600 12px/1.4 "Microsoft YaHei", "Segoe UI", sans-serif;
      letter-spacing: .04em;
    }
    #pdfjs-outline-close {
      border: 0;
      background: transparent;
      color: #7a8194;
      font-size: 16px;
      line-height: 1;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    #pdfjs-outline-close:hover { background: #eef2ff; color: #2443c4; }

    #pdfjs-outline-list {
      overflow: auto;
      padding: 6px 6px 10px;
    }

    .outline-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      padding: 6px 8px 6px calc(8px + (var(--depth, 1) - 1) * 13px);
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #303748;
      font: 12px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif;
      text-align: left;
      cursor: pointer;
    }

    .outline-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .outline-item-page {
      flex: none;
      color: #9aa3b5;
      font: 10.5px/1.5 "Cascadia Code", Consolas, monospace;
    }

    .outline-item:hover { background: #eef2ff; color: #2443c4; }
    .outline-item:hover .outline-item-page { color: #2443c4; }

    .outline-item.active {
      background: #e6ecff;
      color: #1f3fa3;
      font-weight: 600;
    }
    .outline-item.active .outline-item-page { color: #1f3fa3; }
    @media (prefers-color-scheme: dark) {
      #pdfjs-outline { background: #22252b; border-right-color: #333740; }
      .outline-head { border-bottom-color: #333740; }
      .outline-heading { color: #e6e8ee; }
      #pdfjs-outline-close { color: #8b93a3; }
      #pdfjs-outline-close:hover { background: #2c313a; color: #c7d2ff; }
      .outline-item { color: #c9ced8; }
      .outline-item-page { color: #7b8394; }
      .outline-item:hover { background: #2a3040; color: #c7d2ff; }
      .outline-item:hover .outline-item-page { color: #c7d2ff; }
      .outline-item.active { background: #2f3a56; color: #dbe3ff; }
      .outline-item.active .outline-item-page { color: #dbe3ff; }
      #pdfjs-outline-toggle { background: #22252b; color: #e6e8ee; border-color: #4d6bfe; }
    }
  </style>
</head>
<body>
  <div id="pdfjs-container"><div id="pdfjs-viewer"></div></div>
  <button id="pdfjs-outline-toggle" type="button" hidden>目录</button>
  <aside id="pdfjs-outline" aria-label="PDF 目录">
    <div class="outline-head">
      <span class="outline-heading">目录</span>
      <button id="pdfjs-outline-close" type="button" title="关闭目录" aria-label="关闭目录">×</button>
    </div>
    <nav id="pdfjs-outline-list"></nav>
  </aside>
  <script type="module" src="pdfjs-viewer.js"></script>
</body>
</html>
