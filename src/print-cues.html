<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>字幕稿</title>
<style>
  @page { size: A4; margin: 16mm 14mm 14mm; }

  :root {
    --ink: #1b1b1f;
    --muted: #6b6f76;
    --accent: #4d6bfe;
    --deep: #1f3fa3;
    --rule: #e3e6ec;
    --base-size: 12pt;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background: #fff;
    font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    font-size: var(--base-size);
    line-height: 1.7;
  }

  /* 屏幕上的调节条；打印时整条隐藏。 */
  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #f4f5f8;
    border-bottom: 1px solid var(--rule);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .bar label { color: var(--muted); }

  .bar input[type="range"] { width: 180px; }

  .bar .value {
    min-width: 46px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .bar button {
    padding: 4px 10px;
    border: 1px solid #cfd4de;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }

  .sheet { padding: 34px 40px 40px; }

  @media print {
    .bar { display: none; }
    .sheet { padding: 0; }
  }

  .cover {
    padding-top: 30px;
    margin-bottom: 30px;
    border-top: 6px solid var(--accent);
  }

  .eyebrow {
    margin: 0 0 16px;
    color: var(--muted);
    font: 600 7.5pt/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 12px;
    color: var(--deep);
    font-size: calc(var(--base-size) * 1.9);
    line-height: 1.22;
    letter-spacing: .01em;
  }

  .meta {
    margin: 2px 0;
    color: var(--muted);
    font: 9pt/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .meta strong { color: var(--ink); font-weight: 600; }

  .chapter {
    margin: 26px 0 10px;
    padding-top: 12px;
    border-top: 2px solid var(--accent);
    color: var(--deep);
    font: 700 9.5pt/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: .16em;
    text-transform: uppercase;
    break-after: avoid;
  }

  .cue {
    display: flex;
    gap: 14px;
    padding: 4px 0;
    break-inside: avoid;
  }

  .cue .t {
    flex: 0 0 52px;
    color: var(--accent);
    font: calc(var(--base-size) * 0.72)/1.75 "Cascadia Code", Consolas, monospace;
  }

  .cue .x { flex: 1; }

  .empty {
    padding: 24px 0;
    color: var(--muted);
    font: 10pt/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <label for="size">字号</label>
  <input id="size" type="range" min="9" max="18" step="0.5" value="12">
  <span class="value" id="size-value">12 pt</span>
  <button id="print" type="button">打印 / 另存为 PDF</button>
</div>
<main id="doc" class="sheet"></main>
<script src="print-cues.js"></script>
</body>
</html>
