<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH（实验）</title>
  <link rel="stylesheet" href="dsh.css">
</head>
<body>
  <header class="bar">
    <strong>DSH（实验）</strong>
    <span id="status" class="status">检测中…</span>
    <button id="retry" type="button">重试</button>
  </header>
  <main>
    <section id="offline" class="card" hidden>
      <h1>DSH 没有在运行</h1>
      <p>扩展不能启动本地进程。请先在终端启动 DSH 的 web 服务，然后点「重试」。</p>
      <pre id="command">dsh web</pre>
      <button id="copy" type="button">复制命令</button>
      <p class="hint">探测地址：<code>http://127.0.0.1:3080</code></p>
    </section>
    <iframe id="frame" title="DSH" hidden></iframe>
  </main>
  <script src="dsh.js"></script>
</body>
</html>
