<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeepSeek PDF 阅读器</title>
  <link rel="stylesheet" href="pdf-reader.css">
</head>
<body>
  <header id="bar">
    <div class="brand">
      <img src="../icons/icon32.png" width="20" height="20" alt="">
      <span>DeepSeek<span class="plus">+</span> PDF</span>
    </div>
    <div id="file-name" class="file-name">PDF</div>
    <div class="actions">
      <span id="status" class="status">加载中…</span>
      <button id="btn-open-side" class="btn" type="button">打开 DeepSeek 侧边栏</button>
      <button id="btn-reload" class="btn ghost" type="button">重新加载</button>
    </div>
  </header>

  <main id="viewer">
    <div id="overlay" class="overlay">
      <div class="spinner" aria-hidden="true"></div>
      <div id="overlay-text">正在读取 PDF…</div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="pdf-reader.js"></script>
</body>
</html>
