<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导出对话</title>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <header class="toolbar no-print">
    <div class="toolbar-copy">
      <strong id="doc-title">对话</strong>
      <span id="doc-meta"></span>
    </div>
    <div class="toolbar-actions">
      <div class="selection" role="group" aria-label="导出范围">
        <button id="sel-all" class="chip active" type="button">全选</button>
        <button id="sel-user" class="chip" type="button">仅选用户</button>
        <button id="sel-assistant" class="chip" type="button">仅选模型</button>
        <span id="sel-count" class="count">已选择 0 条</span>
      </div>
      <button id="btn-print" class="btn primary" type="button" disabled>导出 / 打印</button>
      <button id="btn-close" class="btn ghost" type="button">关闭</button>
    </div>
  </header>
  <p id="print-hint" class="hint no-print">在打印对话框里选择“另存为 PDF”。取消勾选的消息不会出现在 PDF 里。</p>
  <main id="doc"></main>
  <script src="print.js"></script>
</body>
</html>
